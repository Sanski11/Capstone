<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ezStay - All Upcoming Events</title>

  <!-- Core CSS -->
  <link href="{{ url_for('static', filename='libs/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">

  <style>
    :root {
      --ez-primary: #8a2be2;
      --bg-bookings: #8A2BE2;
      --bg-housekeeping: #FF69B4;
      --bg-dining: #DA70D6;
      --bg-holiday: #28a745;
    }

    body {
      background-color: #f8f9fa;
      font-family: "Poppins", sans-serif;
    }

    .header {
      background-color: var(--ez-primary);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    .badge-category {
      padding: 6px 10px;
      border-radius: 8px;
      color: white;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .bg-event-bookings { background-color: var(--bg-bookings); }
    .bg-event-housekeeping { background-color: var(--bg-housekeeping); }
    .bg-event-dining { background-color: var(--bg-dining); }
    .bg-event-holiday { background-color: var(--bg-holiday); }

    .back-link {
      text-decoration: none;
      font-weight: 500;
      color: var(--ez-primary);
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="container my-5">
    <div class="header">
      <h2>All Upcoming Events</h2>
      <p class="mb-0">Here is a summary of all upcoming activities and schedules</p>
    </div>

    <div class="mb-4">
      <a href="{{ url_for('calendar') }}" class="back-link">
        <i class="ri-arrow-left-line"></i> Back to Calendar
      </a>
    </div>

    <div class="card shadow-sm p-4">
      <div class="table-responsive">
        <table id="eventsTable" class="table table-bordered table-striped align-middle">
          <thead class="table-primary">
            <tr>
              <th>#</th>
              <th>Event Title</th>
              <th>Category</th>
              <th>Date</th>
              <th>Description</th>
              <th>Days Left</th>
            </tr>
          </thead>
          <tbody id="eventsBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JS Libraries -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{{ url_for('static', filename='libs/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

  <script>
    function calculateDaysLeft(eventDate) {
      const today = new Date();
      const event = new Date(eventDate);
      const diffTime = event - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function renderEventsTable() {
      const tbody = document.getElementById("eventsBody");
      tbody.innerHTML = "";

      const stored = JSON.parse(localStorage.getItem("ezstay_events")) || [];

      if (stored.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">
          <i class="ri-calendar-line display-6"></i><br>
          No upcoming events yet. Add one from your Full Calendar page.
        </td></tr>`;
        return;
      }

      const today = new Date();
      const upcoming = stored.filter(ev => new Date(ev.start) >= today);
      upcoming.sort((a, b) => new Date(a.start) - new Date(b.start));

      upcoming.forEach((ev, index) => {
        const daysLeft = calculateDaysLeft(ev.start);
        const colorClass =
          daysLeft > 7 ? "text-success" :
          daysLeft > 3 ? "text-warning" :
          daysLeft > 0 ? "text-danger" : "text-muted";

        const categoryClass = ev.className || "bg-event-bookings";
        const categoryName = (ev.className?.replace("bg-event-", "") || "event")
          .replace(/^\w/, c => c.toUpperCase());

        const row = `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${ev.title}</strong></td>
            <td><span class="badge-category ${categoryClass}">${categoryName}</span></td>
            <td>${new Date(ev.start).toDateString()}</td>
            <td>${ev.description || "No description provided."}</td>
            <td class="${colorClass}">
              ${daysLeft > 0 ? daysLeft + " day(s) left" : "Event completed"}
            </td>
          </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });

      $("#eventsTable").DataTable({ pageLength: 10 });
    }

    document.addEventListener("DOMContentLoaded", renderEventsTable);
  </script>
</body>
</html>
