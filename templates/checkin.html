<!DOCTYPE html>
<html>
<head>
  <title>Page</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Check-in</h1>

    <table id="checkinTable" class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Room ID</th>
          <th>Room Number</th>
          <th>Action</th>
          <th>Room Type</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for room in rooms %}
        <tr>
          <td>{{ room.room_id }}</td>
          <td>{{ room.room_number }}</td>
          <td>
            <a href="#"><i class="bi bi-pencil-square"></i></a>
            <a href="#" class="text-danger ms-2"><i class="bi bi-trash-fill"></i></a>
            {% if room.status == 'Occupied' %}
            <form action="/checkout" method="POST" style="display:inline;">
              <input type="hidden" name="booking_id" value="{{ room.booking_id }}">
              <input type="datetime-local" name="actual_check_out" required>
              <button type="submit" class="btn btn-sm btn-warning ms-2">Checkout</button>
            </form>
            {% endif %}
          </td>
          <td>{{ room.room_type }}</td>
          <td>{{ room.status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <a href="/dashboard" class="btn btn-secondary mt-3">← Back to Homepage</a>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <!-- Initialize DataTable -->
  <script>
    $(document).ready(function() {
  $('#checkinTable').DataTable({
    "order": [[0, "asc"]],
    "pageLength": 10,
    "lengthMenu": [5, 10, 25, 50, 100]
  });
});
  </script>
</body>
</html>
