<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Reset Password</title>

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='images/brand-logos/favicon.ico') }}" type="image/x-icon">

  <!-- Bootstrap -->
  <link href="{{ url_for('static', filename='libs/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

  <!-- Icons -->
  <link href="{{ url_for('static', filename='icons.css') }}" rel="stylesheet">

  <!-- Vyzor Styles -->
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body class="authentication-background">
  <div class="authentication-basic-background">
    <img src="{{ url_for('static', filename='images/media/backgrounds/9.png') }}" alt="">
  </div>

  <!-- Toast / Error Messages -->
  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    <div id="customToast" class="toast show text-bg-primary border-0">
      <div class="d-flex">
        <div class="toast-body">
          {{ messages[0] }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="closeToast()"></button>
      </div>
    </div>
  </div>
  {% endif %}
  {% endwith %}

  <div class="container">
    <div class="row justify-content-center align-items-center authentication authentication-basic h-100">
      <div class="col-xxl-4 col-xl-5 col-lg-6 col-md-6 col-sm-8 col-12">
        <div class="card custom-card border-0 my-4">
          <div class="card-body p-5">

            <div class="text-center mb-4">
              <h4 class="fw-semibold mb-1">Reset Your Password</h4>
              <p class="text-muted fw-normal">Enter and confirm your new password below</p>
            </div>

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
              <div class="mb-3">
                <label for="new_password" class="form-label text-default">New Password</label>
                <div class="position-relative">
                  <input type="password" name="new_password" id="new_password" class="form-control form-control-lg"
                    placeholder="Enter new password" minlength="8" maxlength="60" required>
                  <a href="javascript:void(0);" class="show-password-button text-muted"
                    onclick="togglePassword('new_password', this)"><i class="ri-eye-off-line align-middle"></i></a>
                </div>
                <small class="text-muted fs-12">Password must be 8–60 characters long.</small>
              </div>

              <div class="mb-3">
                <label for="confirm_password" class="form-label text-default">Confirm Password</label>
                <div class="position-relative">
                  <input type="password" name="confirm_password" id="confirm_password" class="form-control form-control-lg"
                    placeholder="Confirm new password" minlength="8" maxlength="60" required>
                  <a href="javascript:void(0);" class="show-password-button text-muted"
                    onclick="togglePassword('confirm_password', this)"><i class="ri-eye-off-line align-middle"></i></a>
                </div>
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Reset Password</button>
              </div>

              <div class="text-center mt-3 fw-medium">
                <a href="{{ url_for('login') }}" class="text-primary">Cancel and go back to Login</a>
              </div>

              {% if error %}
              <p class="text-danger text-center mt-3">{{ error }}</p>
              {% endif %}
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    function togglePassword(id, el) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        el.innerHTML = '<i class="ri-eye-line align-middle"></i>';
      } else {
        input.type = "password";
        el.innerHTML = '<i class="ri-eye-off-line align-middle"></i>';
      }
    }

    function closeToast() {
      const toast = document.getElementById("customToast");
      if (toast) toast.style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
      const toast = document.getElementById("customToast");
      if (toast) {
        setTimeout(() => toast.style.display = "none", 3000);
      }
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="{{ url_for('static', filename='libs/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
