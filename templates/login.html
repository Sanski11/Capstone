<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

 <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='images/brand-logos/favicon.ico') }}" type="image/x-icon">

  <!-- Bootstrap -->
  <link href="{{ url_for('static', filename='libs/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

  <!-- Icons -->
  <link href="{{ url_for('static', filename='icons.css') }}" rel="stylesheet">

  <!-- Vyzor Styles -->
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-color: rgb(248, 249, 253);">

  <div class="card shadow-lg p-4" style="width: 380px; border-radius: 1rem;">
    <h3 class="text-center mb-4" style="color: rgb(152,95,253);">Sign In</h3>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else ('danger' if category == 'danger' else 'warning') }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username or Email</label>
        <input type="text" name="username_or_email" class="form-control" placeholder="Enter your username or email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="showPassword" onclick="togglePassword()">
          <label class="form-check-label" for="showPassword">Show Password</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>

      <div class="text-center">
        <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot your password?</a><br>
        <a href="{{ url_for('signup') }}" class="text-decoration-none">Create an account</a>
      </div>
    </form>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='libs/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

  <script>
    // Show/hide password
    function togglePassword() {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    }

    // Auto-hide flash messages after 3 seconds
    document.addEventListener("DOMContentLoaded", function () {
      const alerts = document.querySelectorAll('.alert');
      setTimeout(() => {
        alerts.forEach(alert => {
          const bsAlert = new bootstrap.Alert(alert);
          bsAlert.close();
        });
      }, 3000);
    });
  </script>
</body>
</html>
